import org.apache.tools.ant.taskdefs.condition.Os
import java.nio.file.Files;
import java.nio.file.Path;
import java.nio.file.attribute.PosixFilePermission;

plugins {
    id "java"
    id "org.graalvm.buildtools.native" version "1.1.9"
}

sourceSets {
    test {
        java {
            srcDirs = ['test/jtreg', file("test/jtreg/generator").listFiles(), 'test/lib', 'test/testng']
            // exclude all test files from compilation. Jtreg compiles these for us when tests run
            exclude "**/*"
        }
    }
}

dependencies {
    // add jtreg jars as dependencies of tests
    testImplementation fileTree(dir: findProperty("jtreg_home") + "/lib/", include: "*.jar")
}

def static checkPath(String p) {
    if (!Files.exists(Path.of(p))) {
        throw new IllegalArgumentException("Error: the path ${p} does not exist");
    }
}

// Name of the libclang shared library to ship, which cannot be derived from the clang version:
// LLVM 13 ships libclang.so.13, while LLVM 22 ships libclang.so.22.1.8 behind a lib/clang/22
// resource directory. Pick a single libclang.so.<version> file, preferring a real file over the
// symlinks pointing at it, so that exactly one file is copied and renamed to libclang.so. Note
// that the unversioned libclang.so symlink cannot be followed instead: distributions may point
// it at a differently named file outside this directory (e.g. libclang-20.so.20).
def static realLibclangName(String libclangDir) {
    def versioned = ((new File(libclangDir).listFiles() ?: new File[0]) as List)
            .findAll { it.name.startsWith("libclang.so.") }
            .sort { it.name }
    if (versioned.isEmpty()) {
        // some distributions ship the library under the unversioned name only
        if (Files.isRegularFile(Path.of(libclangDir, "libclang.so"))) {
            return "libclang.so"
        }
        throw new IllegalArgumentException("Could not find a libclang shared library in ${libclangDir}")
    }
    def real = versioned.find { !Files.isSymbolicLink(it.toPath()) }
    return (real ?: versioned.first()).name
}

def llvm_home = project.property("llvm_home")
def jdk_home = project.property("jdk_home")
checkPath(llvm_home)
checkPath("${llvm_home}/lib/clang")
def clang_versions = new File("${llvm_home}/lib/clang/").list();
if (clang_versions.length == 0) {
    throw new IllegalArgumentException("Could not detect clang version." +
            " Make sure a ${llvm_home}/lib/clang/<VERSION> directory exists")
}
def clang_version = clang_versions[0]

def buildDir = layout.buildDirectory.get()
def jextract_version = "25"
def jmods_dir = "$buildDir/jmods"
def jextract_jmod_file = "$jmods_dir/org.openjdk.jextract.jmod"
def jextract_jmod_inputs = "$buildDir/jmod_inputs"
def jextract_app_dir = "$buildDir/jextract"
def jextract_runtime_dir = "$jextract_app_dir/runtime"
def jextract_bin_dir = "$jextract_app_dir/bin"
def clang_include_dir = "${llvm_home}/lib/clang/${clang_version}/include"
checkPath(clang_include_dir)
def os_lib_dir = Os.isFamily(Os.FAMILY_WINDOWS)? "bin" : "lib"
def os_script_extension = Os.isFamily(Os.FAMILY_WINDOWS)? ".bat" : ""
def os_exe_suffix = Os.isFamily(Os.FAMILY_WINDOWS)? ".exe" : "" // needed for some, but not all shells
def libclang_dir = "${llvm_home}/${os_lib_dir}"
checkPath(libclang_dir)

repositories {
    mavenCentral()
}

compileJava {
    options.release = 25
    options.fork = true
    options.forkOptions.executable = "${jdk_home}/bin/javac${os_exe_suffix}"
}

jar {
    archiveBaseName = 'org.openjdk.jextract'
    archiveVersion = project.version
}

tasks.register("copyLibClang", Sync) {
    into("$buildDir/jmod_inputs")

    // make sure we only pick up the "real" shared library file from LLVM installation
    // (e.g. exclude symlinks on Linux)
    def isAix = Os.isName("AIX") || Os.isName("aix")
    def isUnixNotMac  = Os.isFamily(Os.FAMILY_UNIX) && !Os.isFamily(Os.FAMILY_MAC)
    def clang_path_include = isAix  ? "libclang.a" : isUnixNotMac ? realLibclangName(libclang_dir) : "*clang*"
    // A distribution libclang links against a shared libLLVM, which sits behind several
    // symlinks (libLLVM.so, libLLVM.so.1, libLLVM.so.20.1) all leading to one real file.
    // Sync dereferences symlinks, so a wildcard would copy the same (large) library once per
    // name: ship one copy per real file instead, under its most specific name, which by
    // symlink convention is the soname that libclang's dynamic section refers to.
    def libllvm_names = ((new File(libclang_dir).listFiles() ?: new File[0]) as List)
            .findAll { it.name.startsWith("libLLVM.") }
            .groupBy { it.toPath().toRealPath() }
            .values()
            .collect { group -> group.max { it.name.length() }.name }
    from("${libclang_dir}") {
        include(clang_path_include)
        libllvm_names.each { include(it) }
        exclude("clang.exe")
        into("libs")
        // make sure we drop shared library version name (Linux only)
        rename("libclang.so.*", "libclang.so")
    }
    from("$clang_include_dir") {
        include("*.h")
        into("conf/jextract")
    }
}

tasks.register("createJextractJmod", Exec) {
    dependsOn jar, tasks.named("copyLibClang")

    // if these inputs or outputs change, gradle will rerun the task
    inputs.file(jar.archiveFile.get())
    inputs.dir("$jextract_jmod_inputs")
    outputs.file(jextract_jmod_file)

    doFirst {
        delete(jextract_jmod_file)
    }

    executable = "${jdk_home}/bin/jmod"
    args = [
          "create",
          "--module-version=$jextract_version",
          "--class-path=" + jar.archiveFile.get(),
          "--libs=$jextract_jmod_inputs/libs",
          "--conf=$jextract_jmod_inputs/conf",
          "${jextract_jmod_file}"
    ]
}

tasks.register("createJextractImage", Exec) {
    dependsOn tasks.named("createJextractJmod")

    // if these inputs or outputs change, gradle will rerun the task
    inputs.file("$jextract_jmod_file")
    outputs.dir(jextract_app_dir)

    def quote_jlink_opts = Os.isFamily(Os.FAMILY_WINDOWS)?
        '\\"--enable-native-access=org.openjdk.jextract\\"' :
        '"--enable-native-access=org.openjdk.jextract"'

    doFirst {
        delete(jextract_app_dir)
        mkdir "${jextract_bin_dir}"
    }

    executable = "${jdk_home}/bin/jlink"
    args = [
         "--module-path=$jmods_dir",
         "--add-modules=org.openjdk.jextract",
         "--output=${jextract_runtime_dir}",
         "--strip-debug", "--no-man-pages", "--no-header-files",
         "--add-options",
         "${quote_jlink_opts}"
    ]

    doLast {
        // Add launcher scripts
        Path unixOut = Path.of("${jextract_bin_dir}/jextract");
        Files.copy(Path.of("$projectDir/src/main/jextract"), unixOut);
        if (unixOut.getFileSystem().supportedFileAttributeViews().contains("posix")) {
            Set<PosixFilePermission> perms = Files.getPosixFilePermissions(unixOut);
            perms.add(PosixFilePermission.OWNER_EXECUTE);
            perms.add(PosixFilePermission.GROUP_EXECUTE);
            perms.add(PosixFilePermission.OTHERS_EXECUTE);
            Files.setPosixFilePermissions(unixOut, perms);
        }

        Files.copy(Path.of("$projectDir/src/main/jextract.bat"), Path.of("${jextract_bin_dir}/jextract.bat"))
        Files.copy(Path.of("$projectDir/src/main/jextract.ps1"), Path.of("${jextract_bin_dir}/jextract.ps1"))
    }
}

// build the jextract image when the build or assemble task is run
tasks.named("assemble").configure {
    dependsOn tasks.named("createJextractImage")
}

// very simple integration test for generated jextract
tasks.register("verify", Exec) {
    dependsOn tasks.named("createJextractImage")

    executable = "${jextract_bin_dir}/jextract${os_script_extension}"
    args = [ "test.h", "--output", "$buildDir/integration_test" ]
}

// jlink a JDK image with org.openjdk.jextract for testing
tasks.register("createRuntimeImageForTest", Exec) {
    dependsOn tasks.named("createJextractJmod")

    def out_dir = "$buildDir/jextract-jdk-test-image"

    // if these inputs or outputs change, gradle will rerun the task
    inputs.file("$jextract_jmod_file")
    outputs.dir(out_dir)

    doFirst {
        delete(out_dir)
    }

    executable = "${jdk_home}/bin/jlink"
    // Some JDK distributions ship without packaged modules (no jmods directory). Since JDK 24
    // (JEP 493) jlink can link those modules from the run-time image instead, but they are then
    // not on the module path, so ALL-MODULE-PATH alone would silently reduce the test image to
    // the jextract module and its closure. Name the JDK modules the tests need explicitly;
    // with a full jmods directory present these are already covered by ALL-MODULE-PATH.
    args = [
         "--module-path=$jmods_dir" + File.pathSeparator + "$jdk_home/jmods",
         "--add-modules=ALL-MODULE-PATH,jdk.compiler,jdk.javadoc,jdk.jartool,jdk.zipfs,jdk.attach,jdk.management,jdk.incubator.vector",
         "--output=$out_dir",
    ]
}

tasks.register("cmakeConfigure", Exec) {
    executable = "cmake"
    args = [
        "-B", "$buildDir/testlib-build",
        "-S", "$projectDir/test/test-support",
        "-DTEST_SOURCE_ROOT:FILEPATH=$projectDir/test",
        "-DCMAKE_BUILD_TYPE:STRING=Release",
        "-DCMAKE_INSTALL_PREFIX:FILEPATH=$buildDir/testlib-install"
    ]
}

tasks.register("cmakeBuild", Exec) {
    dependsOn tasks.named("cmakeConfigure")

    executable = "cmake"
    args = [
        "--build", "$buildDir/testlib-build",
        "--config", "Release",
        "--target", "install"
    ]
}

// alias that can be easily referenced from a run configuration
tasks.register("testDeps") {
    dependsOn "createRuntimeImageForTest", "cmakeBuild"
}

void createJtregTask(String name, String jacocoAgent, String os_lib_dir) {
    tasks.register(name, JavaExec) {
        dependsOn "testDeps"

        if (findProperty("jtreg_home") == null) {
            throw new GradleException("jtreg_home is not defined")
        }

        workingDir = "$buildDir"

        classpath = files(findProperty("jtreg_home") + "/lib/jtreg.jar")

        args = [
                "-jdk", "$buildDir/jextract-jdk-test-image",
                "-nativepath:$buildDir/testlib-install/${os_lib_dir}",
                "-javaoption:--enable-native-access=org.openjdk.jextract,ALL-UNNAMED",
                "-javacoption:--add-exports=org.openjdk.jextract/org.openjdk.jextract.json.parser=ALL-UNNAMED",
                "-javaoption:--add-exports=org.openjdk.jextract/org.openjdk.jextract.json.parser=ALL-UNNAMED",
                "-avm", "-conc:auto", "-verbose:summary,fail,error",
                "-retain:fail,error"
        ]

        if (jacocoAgent != null) {
            String coverageFile = "$buildDir/jacoco-run/jextract.exec"
            String includes = "org.openjdk.jextract.*"
            args += "-javaoption:-javaagent:$jacocoAgent=destfile=$coverageFile,includes=$includes"
        }

        args += "../test"
    }
}

createJtregTask("jtreg", null, os_lib_dir)
// e.g.: <jacoco repo>/org.jacoco.agent/target/classes/jacocoagent.jar
String jacocoAgent = findProperty("jacoco_agent")
if (jacocoAgent != null) {
    createJtregTask("jtregWithCoverage", jacocoAgent, os_lib_dir)
}

tasks.register("coverage", JavaExec) {
    dependsOn "jtregWithCoverage"

    // e.g.: <jacoco repo>/org.jacoco.cli/target/org.jacoco.cli-0.8.12-SNAPSHOT-nodeps.jar
    if (findProperty("jacoco_cli") == null) {
        throw new GradleException("jacoco_cli is not defined")
    }

    classpath = files(findProperty("jacoco_cli"))

    args = [
            "report",
            "$buildDir/jacoco-run/jextract.exec",
            "--classfiles", "$buildDir/classes/java/main",
            "--sourcefiles", "$projectDir/src/main/java",
            "--html", "$buildDir/jacoco-report"
    ]
}
//------------------------------------------------------------
// Task to generate version file into jmod inputs
//------------------------------------------------------------
tasks.register('writeLibClangVersion') {
    def confDir = file("$buildDir/jmod_inputs/conf/jextract")
    outputs.file("$confDir/libclang.version")
    def clang_major_version = clang_version.tokenize('.')[0]
    doLast {
        confDir.mkdirs()
        file("$confDir/libclang.version").text = clang_major_version + "\n"
    }
}

tasks.named("createJextractJmod") {
    dependsOn "writeLibClangVersion"
}

//------------------------------------------------------------
// GraalVM native-image build
//------------------------------------------------------------
def jextract_native_dir = "$buildDir/jextract-native"
def jextract_native_bin_dir = "$jextract_native_dir/bin"
def jextract_native_lib_dir = "$jextract_native_dir/libs"

graalvmNative {
    // The GraalVM used for the build is the JVM running Gradle (or GRAALVM_HOME), not a Gradle toolchain
    toolchainDetection = false

    binaries {
        main {
            imageName = "jextract"
            mainClass = "org.openjdk.jextract.JextractTool"
            // libclang is loaded, and its downcall handles are bound, when the image runs
            buildArgs.add("--enable-native-access=ALL-UNNAMED")
            buildArgs.add("--initialize-at-run-time=org.openjdk.jextract.clang.libclang.Index_h")
        }
    }
}

// Lay the native executable out like the jlink image: the clang builtin headers live in
// conf/jextract, next to bin/, which is where JextractTool looks for them.
tasks.register("createJextractNativeImage", Sync) {
    dependsOn tasks.named("nativeCompile"), "copyLibClang", "writeLibClangVersion"

    into(jextract_native_dir)

    from(layout.buildDirectory.dir("native/nativeCompile")) {
        include("jextract", "jextract.exe")
        into("bin")
    }
    from(jextract_jmod_inputs) {
        include("libs/**", "conf/**")
    }
}

// Runs jextract from the classpath on a regular JVM. Under the GraalVM tracing agent
// (-Pnative_metadata_out=<dir>) this records the libclang downcalls that the native image must
// register, merging into <dir> so that several headers can be traced in turn. See the README.
tasks.register("runJextract", JavaExec) {
    dependsOn classes, "copyLibClang", "writeLibClangVersion"

    classpath = sourceSets.main.runtimeClasspath
    mainClass = "org.openjdk.jextract.JextractTool"

    jvmArgs("--enable-native-access=ALL-UNNAMED")
    systemProperty("java.library.path", "$jextract_jmod_inputs/libs")
    systemProperty("jextract.header.path", clang_include_dir)

    def metadataOut = findProperty("native_metadata_out")
    if (metadataOut != null) {
        jvmArgs("-agentlib:native-image-agent=config-merge-dir=$metadataOut")
    }
}

// same integration test as 'verify', but against the native executable
tasks.register("verifyNative", Exec) {
    dependsOn "createJextractNativeImage"

    executable = "$jextract_native_bin_dir/jextract${os_exe_suffix}"
    args = [ "test.h", "--output", "$buildDir/integration_test_native" ]

    // let the dynamic linker find the libclang shipped alongside the executable
    def libPathVar = Os.isFamily(Os.FAMILY_WINDOWS) ? "PATH" :
            Os.isFamily(Os.FAMILY_MAC) ? "DYLD_LIBRARY_PATH" : "LD_LIBRARY_PATH"
    environment(libPathVar, jextract_native_lib_dir + File.pathSeparator + (System.getenv(libPathVar) ?: ""))
}
